name: Quality

on:
  push:
    branches:
      - main
      - phase-1/public-interface
      - feature/phase-2-cms
      - feature/phase-3-publishing-seo
      - feature/phase-4-automation-integrations
      - feature/phase-5-production-launch
  pull_request:
    branches:
      - main
      - phase-1/public-interface
      - feature/phase-2-cms
      - feature/phase-3-publishing-seo
      - feature/phase-4-automation-integrations
      - feature/phase-5-production-launch

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Production build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          CRON_SECRET: ci-placeholder-cron-secret
          SUPABASE_SECRET_KEY: sb_secret_placeholder
          TELEGRAM_BOT_TOKEN: ci-placeholder-telegram-token
          TELEGRAM_WEBHOOK_SECRET: ci-placeholder-telegram-secret
          TELEGRAM_OWNER_IDS: "123456789"
          TELEGRAM_CHANNEL_ID: ""
          RESEND_API_KEY: re_ci_placeholder
          NEWSLETTER_FROM: "Example <newsletter@example.com>"
        run: pnpm build
      - name: Runtime smoke
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
        run: |
          pnpm start > /tmp/moataz-next.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/ >/dev/null
          curl --fail --silent http://127.0.0.1:3000/offline >/dev/null
          curl --fail --silent http://127.0.0.1:3000/manifest.webmanifest >/dev/null
