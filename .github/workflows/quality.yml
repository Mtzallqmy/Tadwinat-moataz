name: Quality

on:
  push:
    branches:
      - main
      - phase-1/public-interface
      - feature/phase-2-cms
      - feature/phase-3-publishing-seo
      - feature/phase-4-automation-integrations
      - feature/phase-5-production-launch
  pull_request:
    branches:
      - main
      - phase-1/public-interface
      - feature/phase-2-cms
      - feature/phase-3-publishing-seo
      - feature/phase-4-automation-integrations

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Persist lockfile when generated
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml || [ -n "$(git status --porcelain pnpm-lock.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: refresh dependency lockfile"
            git push
          fi

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Production build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          CRON_SECRET: ci-placeholder-cron-secret
          SUPABASE_SECRET_KEY: sb_secret_placeholder
          TELEGRAM_BOT_TOKEN: ci-placeholder-telegram-token
          TELEGRAM_WEBHOOK_SECRET: ci-placeholder-telegram-secret
          TELEGRAM_OWNER_IDS: "123456789"
          TELEGRAM_CHANNEL_ID: ""
          RESEND_API_KEY: re_ci_placeholder
        run: pnpm build
